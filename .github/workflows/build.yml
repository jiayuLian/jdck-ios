name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf JDCookieExtractor.xcodeproj
          xcodegen generate

      - name: Select Xcode 16 (xcodegen emits Xcode 16 project format)
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned .app
        run: |
          xcodebuild -project JDCookieExtractor.xcodeproj \
            -scheme JDCookieExtractor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r JDCookieExtractor.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JDCookieExtractor-ipa
          path: JDCookieExtractor.ipa

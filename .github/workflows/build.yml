name: Build IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          xcodebuild -project JDCookieExtractor.xcodeproj \
            -target JDCookieExtractor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build -name "JDCookieExtractor.app" -type d | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r JDCookieExtractor.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JDCookieExtractor-ipa
          path: JDCookieExtractor.ipa

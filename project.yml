name: JDCookieExtractor
options:
  deploymentTarget:
    iOS: "15.0"
  bundleIdPrefix: com.jiayu
  createIntermediateGroups: true
targets:
  JDCookieExtractor:
    type: application
    platform: iOS
    sources:
      - path: JDCookieExtractor/JDCookieExtractorApp.swift
      - path: JDCookieExtractor/ContentView.swift
      - path: JDCookieExtractor/LoginWebView.swift
      - path: JDCookieExtractor/QinglongManager.swift
      - path: JDCookieExtractor/Assets.xcassets
    info:
      path: JDCookieExtractor/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiayu.jdcookieextractor
        PRODUCT_NAME: JDCookie
        INFOPLIST_FILE: JDCookieExtractor/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: "NO"
        ONLY_ACTIVE_ARCH: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  JDCookieExtractor:
    build:
      targets:
        JDCookieExtractor: all
    run:
      config: Release
    archive:
      config: Release
